services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: arqa
      POSTGRES_DB: arqa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arqa -d arqa"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
